<meta charset="UTF-8">

<style>
  :root{
    --paper:#f4ecdf; --ink:#2c2118; --ink-soft:#6b5b48;
    --cover:#4a1420; --cover-2:#2c0c14; --gold:#c99a4a; --gold-soft:#e4c98a;
    --bg:#f1ece3; --bg-2:#e7ded0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0e0c0a; --bg-2:#151210; }
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100%; font-family:'Karla',sans-serif; color:var(--ink);
    background:radial-gradient(circle at 50% -10%, var(--bg-2), var(--bg) 60%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 16px 40px;
  }
  h1,h2{font-family:'Cormorant Garamond',serif; font-weight:600; margin:0}

  /* ---------- loading / error states ---------- */
  .state{ text-align:center; max-width:320px; }
  .state .spin{
    width:34px; height:34px; margin:0 auto 16px; border-radius:50%;
    border:3px solid #d9c9a8; border-top-color:var(--cover); animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .state p{ color:var(--ink-soft); font-size:13px; line-height:1.6; }

  /* ---------- viewer ---------- */
  .viewer{ display:none; width:100%; max-width:420px; flex-direction:column; align-items:center; }
  .viewer.active{ display:flex; }

  .music-toggle{
    position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:20;
    width:38px; height:38px; border-radius:50%; border:1px solid #d9c9a8; background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px;
  }

  .book-stage{ perspective:1800px; width:100%; aspect-ratio:9/16; max-width:340px; margin:10px auto 18px; position:relative; touch-action:pan-y; cursor:grab; user-select:none; }
  .book{ position:relative; width:100%; height:100%; border-radius:6px 12px 12px 6px; box-shadow:0 30px 60px -20px rgba(20,10,5,.5), 0 2px 0 2px var(--cover-2); }
  .leaf{ position:absolute; inset:0; border-radius:6px 12px 12px 6px; overflow:hidden; transform-origin:left center; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.4,.1,.2,1); }
  .leaf .face{ position:absolute; inset:0; backface-visibility:hidden; display:flex; align-items:center; justify-content:center; }
  .leaf .face.back{ transform:rotateY(180deg); }

  .page-cover{ background:linear-gradient(135deg,var(--cover),var(--cover-2)); color:var(--gold-soft); flex-direction:column; text-align:center; padding:26px; }
  .page-cover img{ width:100%; height:66%; object-fit:cover; border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,.4); margin-bottom:16px; border:1px solid rgba(228,201,138,.4); }
  .cov-eyebrow{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .page-cover h2{ font-size:22px; color:#fbf3e3; }
  .cov-sub{ font-size:12px; color:#d9c3a0; margin-top:6px; }

  .page-inner{ background:var(--paper); flex-direction:column; padding:16px; background-image:repeating-linear-gradient(rgba(0,0,0,.02) 0 1px, transparent 1px 34px); }
  .page-inner img{ width:100%; height:84%; object-fit:cover; border-radius:8px; box-shadow:0 6px 16px rgba(60,40,20,.18); }
  .page-inner .cap{ margin-top:10px; text-align:center; font-family:'Caveat',cursive; font-size:20px; color:var(--ink-soft); }
  .page-num{ position:absolute; bottom:10px; right:14px; font-size:10px; color:var(--ink-soft); opacity:.6; }

  .page-end{ background:linear-gradient(135deg,var(--cover),var(--cover-2)); color:var(--gold-soft); flex-direction:column; text-align:center; padding:26px; }
  .page-end img{ width:100%; height:66%; object-fit:cover; border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,.4); margin-bottom:16px; border:1px solid rgba(228,201,138,.4); }
  .page-end .end-msg{ font-family:'Caveat',cursive; font-size:22px; color:#f4e4c2; line-height:1.3; }

  .book-controls{ display:flex; align-items:center; gap:18px; margin-top:4px; }
  .nav-btn{ width:44px; height:44px; border-radius:50%; border:1px solid #d9c9a8; background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--cover); font-size:18px; }
  .nav-btn:disabled{ opacity:.35; }
  .page-count{ font-size:12px; color:var(--ink-soft); min-width:64px; text-align:center; }
  .made-with{ margin-top:18px; font-size:11px; color:var(--ink-soft); opacity:.7; }
</style>
</head>
<body>

  <div class="state" id="loadingState">
    <div class="spin"></div>
    <p>Opening your flipbook…</p>
  </div>

  <div class="state" id="errorState" style="display:none;">
    <h2 style="font-size:20px; margin-bottom:8px;">Couldn't open this flipbook</h2>
    <p id="errorMsg">This link looks incomplete or the flipbook could not be found.</p>
  </div>

  <button class="music-toggle" id="musicToggle" style="display:none;">🔊</button>
  <audio id="bgMusic" loop></audio>

  <div class="viewer" id="viewer">
    <div class="book-stage" id="bookStage">
      <div class="book" id="book"></div>
    </div>
    <div class="book-controls">
      <button class="nav-btn" id="prevBtn" onclick="turn(-1)">‹</button>
      <span class="page-count" id="pageCount"></span>
      <button class="nav-btn" id="nextBtn" onclick="turn(1)">›</button>
    </div>
    <div class="made-with">Made with Ditemps</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  // Same Firebase project as the main Ditemps site — this page only READS
  // the one card document named in ?id=, it never writes anything.
  const firebaseConfig = {
    apiKey: "AIzaSyDneahIyDuurQB30uGrM0iC6xkDv71yUjo",
    authDomain: "ditemps.firebaseapp.com",
    projectId: "ditemps",
    storageBucket: "ditemps.firebasestorage.app",
    messagingSenderId: "14858245467",
    appId: "1:14858245467:web:97cdf1133278e001c6367e"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function showError(msg){
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorMsg').textContent = msg;
    document.getElementById('errorState').style.display = 'block';
  }

  const params = new URLSearchParams(location.search);
  const cardId = params.get('id');
  if (!cardId) {
    showError('This link is missing its flipbook ID. Please use the exact link that was generated on Ditemps.');
  } else {
    getDoc(doc(db, 'cards', cardId)).then(snap => {
      if (!snap.exists()) { showError('This flipbook could not be found — the link may be wrong or expired.'); return; }
      render(snap.data() || {});
    }).catch(err => {
      console.error(err);
      showError('Something went wrong while opening this flipbook. Please try again.');
    });
  }

  function render(data){
    const frontPhoto = Array.isArray(data.frontPhoto) ? data.frontPhoto[0] : data.frontPhoto;
    const backPhoto = Array.isArray(data.backPhoto) ? data.backPhoto[0] : data.backPhoto;
    const pages = Array.isArray(data.pages) ? data.pages.filter(Boolean) : [];
    const title = data.frontTitle || 'Our Story';
    const sub = data.frontSub || '';
    const endMsg = data.endMsg || 'Thank you for the memories.';

    document.title = title;

    if (data.music) {
      const audio = document.getElementById('bgMusic');
      const toggle = document.getElementById('musicToggle');
      audio.src = data.music;
      toggle.style.display = 'flex';
      let playing = false;
      toggle.onclick = () => {
        playing = !playing;
        if (playing) { audio.play().catch(() => {}); toggle.textContent = '🔊'; }
        else { audio.pause(); toggle.textContent = '🔇'; }
      };
      audio.play().then(() => { playing = true; }).catch(() => { playing = false; toggle.textContent = '🔇'; });
    }

    const innerFaces = pages.map((url, i) => `
      <div class="face page-inner">
        <img src="${url}" alt="">
        <div class="cap">Memory ${i + 1}</div>
        <div class="page-num">${i + 1}</div>
      </div>`);

    const faces = [
      `<div class="face page-cover">
        <div class="cov-eyebrow">A little something for you</div>
        ${frontPhoto ? `<img src="${frontPhoto}" alt="">` : ''}
        <h2>${escapeHtml(title)}</h2>
        ${sub ? `<div class="cov-sub">${escapeHtml(sub)}</div>` : ''}
      </div>`,
      ...innerFaces,
      `<div class="face page-end">
        <div class="cov-eyebrow">The End</div>
        ${backPhoto ? `<img src="${backPhoto}" alt="">` : ''}
        <div class="end-msg">${escapeHtml(endMsg)}</div>
      </div>`
    ];
    // Make sure the back cover always lands on the BACK face of the final
    // leaf (never the front of an extra leaf) so the book always closes
    // properly at the end — insert one blank page only when the count is odd.
    if (faces.length % 2 !== 0) {
      faces.splice(faces.length - 1, 0, '<div class="face page-inner"></div>');
    }

    window.leaves = [];
    for (let i = 0; i < faces.length; i += 2){
      window.leaves.push([faces[i], faces[i + 1]]);
    }

    const book = document.getElementById('book');
    book.innerHTML = window.leaves.map((pair, i) => `
      <div class="leaf" id="leaf${i}" style="z-index:${window.leaves.length - i}">
        ${pair[0]}${pair[1]}
      </div>`).join('');
    window.leaves.forEach((_, i) => {
      document.getElementById('leaf' + i).querySelectorAll('.face')[1].classList.add('back');
    });

    window.current = 0;
    updateBook();

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('viewer').classList.add('active');
    setupSwipe();
  }

  window.updateBook = function updateBook(){
    const leaves = window.leaves, current = window.current;
    leaves.forEach((_, i) => {
      const leaf = document.getElementById('leaf' + i);
      leaf.style.transform = i < current ? 'rotateY(-180deg)' : 'rotateY(0deg)';
      leaf.style.zIndex = i < current ? i : (leaves.length - i);
    });
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === leaves.length;
    document.getElementById('pageCount').textContent =
      current === 0 ? 'Cover' : current === leaves.length ? 'The End' : `Page ${current} of ${leaves.length - 1}`;
  };

  window.turn = function turn(dir){
    const next = window.current + dir;
    if (next < 0 || next > window.leaves.length) return;
    window.current = next;
    updateBook();
  };

  function setupSwipe(){
    const stage = document.getElementById('bookStage');
    let startX = null, startY = null, dragging = false;
    function start(x, y){ startX = x; startY = y; dragging = true; }
    function end(x, y){
      if (!dragging || startX === null) { dragging = false; return; }
      const dx = x - startX, dy = y - startY;
      dragging = false; startX = null; startY = null;
      if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) turn(1); else turn(-1);
    }
    stage.addEventListener('touchstart', e => { const t = e.changedTouches[0]; start(t.clientX, t.clientY); }, { passive: true });
    stage.addEventListener('touchend', e => { const t = e.changedTouches[0]; end(t.clientX, t.clientY); }, { passive: true });
    stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') start(e.clientX, e.clientY); });
    stage.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') end(e.clientX, e.clientY); });
  }
</script>
</body>
